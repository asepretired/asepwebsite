<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Asep AI</title><style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#09090b;
    --surface:rgba(20,20,24,.78);
    --surface2:rgba(255,255,255,.045);
    --border:rgba(255,255,255,.08);
    --text:#f5f5f7;
    --muted:#8d8d98;
    --accent:#8b5cf6;
    --accent2:#6d5dfc;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Inter,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.10;
}

.glow.one{
    background:#8b5cf6;
    top:-120px;
    left:-100px;
}

.glow.two{
    background:#6366f1;
    right:-150px;
    bottom:-130px;
}

/* =========================
   APP
========================= */

.app{
    position:relative;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:68px;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid var(--border);

    background:rgba(9,9,11,.72);

    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    z-index:10;
}

/* HANDWRITTEN LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo-mark{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:linear-gradient(
        135deg,
        #9b7cff,
        #6049e9
    );

    color:white;

    font-family:Caveat,cursive;
    font-size:23px;
    font-weight:700;

    transform:rotate(-5deg);

    box-shadow:
        0 6px 24px rgba(124,92,246,.25);
}

.logo-text{
    font-family:Caveat,cursive;
    font-size:27px;
    font-weight:700;
    letter-spacing:-.5px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.online{
    display:flex;
    align-items:center;
    gap:7px;

    padding:7px 11px;

    border-radius:999px;

    background:var(--surface2);
    border:1px solid var(--border);

    color:var(--muted);
    font-size:11px;
}

.online-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#4ade80;

    box-shadow:
        0 0 12px rgba(74,222,128,.8);
}

.icon-button{
    width:37px;
    height:37px;

    display:grid;
    place-items:center;

    border:1px solid var(--border);
    border-radius:12px;

    background:var(--surface2);

    color:#ddd;

    font-size:15px;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.icon-button:active{
    transform:scale(.92);
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    overflow-y:auto;

    padding:
        30px
        18px
        145px;

    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:4px;
}

.chat::-webkit-scrollbar-thumb{
    background:#29292f;
    border-radius:10px;
}

.messages{
    width:min(820px,100%);
    margin:auto;
}

/* =========================
   WELCOME
========================= */

.welcome{
    min-height:55vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    animation:welcomeIn .65s cubic-bezier(.2,.8,.2,1);
}

@keyframes welcomeIn{
    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.welcome-logo{
    width:72px;
    height:72px;

    display:grid;
    place-items:center;

    border-radius:23px;

    background:
        linear-gradient(
            135deg,
            #9575ff,
            #5b4ae7
        );

    font-family:Caveat,cursive;
    font-size:44px;
    font-weight:700;

    transform:rotate(-4deg);

    box-shadow:
        0 18px 60px rgba(108,82,235,.25);
}

.welcome h1{
    margin-top:22px;

    font-size:clamp(38px,10vw,62px);

    letter-spacing:-3px;

    font-weight:700;
}

.welcome p{
    margin-top:9px;

    max-width:350px;

    color:var(--muted);

    font-size:13px;
    line-height:1.6;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:flex;
    gap:12px;

    margin:24px 0;

    animation:
        messageIn .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.avatar{
    width:34px;
    height:34px;
    min-width:34px;

    display:grid;
    place-items:center;

    border-radius:11px;

    font-size:13px;
    font-weight:700;
}

.ai .avatar{
    background:
        linear-gradient(
            135deg,
            #8f72ff,
            #5b4ae7
        );

    font-family:Caveat,cursive;
    font-size:20px;
}

.user .avatar{
    background:#24242a;
}

.message-body{
    min-width:0;
    flex:1;
}

.message-name{
    color:var(--muted);
    font-size:11px;
    margin-bottom:5px;
}

.message-content{
    font-size:14px;
    line-height:1.75;

    white-space:pre-wrap;
    word-break:break-word;
}

/* =========================
   TYPING
========================= */

.typing{
    display:flex;
    align-items:center;
    gap:5px;

    height:25px;
}

.typing span{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#aaa;

    animation:
        typing 1s infinite ease-in-out;
}

.typing span:nth-child(2){
    animation-delay:.12s;
}

.typing span:nth-child(3){
    animation-delay:.24s;
}

@keyframes typing{
    0%,70%,100%{
        transform:translateY(0);
        opacity:.35;
    }

    35%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =========================
   COMPOSER
========================= */

.composer-wrap{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    padding:
        12px
        16px
        calc(12px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            transparent,
            rgba(9,9,11,.92) 30%
        );

    z-index:20;
}

.composer{
    width:min(820px,100%);
    margin:auto;

    display:flex;
    align-items:flex-end;
    gap:7px;

    padding:7px;

    border:1px solid var(--border);
    border-radius:20px;

    background:
        rgba(24,24,29,.86);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.3);

    transition:
        border-color .25s ease,
        box-shadow .25s ease;
}

.composer:focus-within{
    border-color:rgba(139,92,246,.35);

    box-shadow:
        0 15px 55px rgba(0,0,0,.4),
        0 0 0 3px rgba(139,92,246,.06);
}

textarea{
    flex:1;

    min-height:44px;
    max-height:140px;

    resize:none;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-family:inherit;
    font-size:14px;

    line-height:1.5;

    padding:
        12px
        9px;
}

textarea::placeholder{
    color:#6f6f78;
}

.send{
    width:44px;
    height:44px;

    border:0;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #9273ff,
            #5b4ae7
        );

    color:white;

    font-size:17px;

    cursor:pointer;

    transition:
        transform .2s ease,
        opacity .2s ease;
}

.send:active{
    transform:scale(.91);
}

.send:disabled{
    opacity:.45;
}

/* =========================
   SETTINGS MODAL
========================= */

.modal{
    position:fixed;
    inset:0;

    display:none;
    align-items:flex-end;
    justify-content:center;

    padding:16px;

    background:rgba(0,0,0,.58);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(500px,100%);

    padding:22px;

    border-radius:25px;

    background:#17171c;

    border:1px solid var(--border);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);

    animation:
        modalIn .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.modal-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-title h2{
    font-size:18px;
}

.close{
    width:32px;
    height:32px;

    border:0;
    border-radius:10px;

    background:#25252b;
    color:#aaa;

    cursor:pointer;
}

.modal-description{
    margin-top:7px;

    color:var(--muted);

    font-size:12px;
    line-height:1.6;
}

/* API INPUT */

.key-row{
    display:flex;
    gap:7px;

    margin-top:18px;
}

.key-input{
    flex:1;

    min-width:0;

    height:46px;

    padding:0 13px;

    border-radius:13px;

    border:1px solid var(--border);

    background:#0d0d10;

    color:white;

    outline:none;

    font-family:monospace;
    font-size:12px;

    /*
       IMPORTANT:
       text instead of password.
       This gives Android keyboards normal
       clipboard/paste behavior.
    */
    -webkit-user-select:text;
    user-select:text;
}

.key-input:focus{
    border-color:rgba(139,92,246,.5);
}

.paste-button{
    height:46px;

    padding:0 14px;

    border-radius:13px;

    border:1px solid var(--border);

    background:#24242a;

    color:#eee;

    font-size:12px;
    font-weight:600;

    cursor:pointer;

    white-space:nowrap;

    transition:
        transform .2s ease,
        background .2s ease;
}

.paste-button:active{
    transform:scale(.95);
}

.save-button{
    width:100%;

    height:46px;

    margin-top:9px;

    border:0;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #9273ff,
            #5b4ae7
        );

    color:white;

    font-size:13px;
    font-weight:700;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

    .online{
        display:none;
    }

    .header{
        padding:0 14px;
    }

    .chat{
        padding-top:20px;
    }

    .welcome{
        min-height:58vh;
    }

    .modal{
        padding:
            10px
            10px
            calc(10px + env(safe-area-inset-bottom));
    }

    .modal-card{
        border-radius:24px;
    }
}
</style></head><body><div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div><div class="app"><header class="header"><div class="logo">
    <div class="logo-mark">A</div>
    <div class="logo-text">Asep AI</div>
</div>

<div class="header-right">

    <div class="online">
        <span class="online-dot"></span>
        Gemini
    </div>

    <button
        class="icon-button"
        onclick="openSettings()">
        ⚙
    </button>

</div>

</header><main class="chat" id="chat"><div class="messages" id="messages">

    <section class="welcome" id="welcome">

        <div class="welcome-logo">A</div>

        <h1>Asep AI</h1>

        <p>
            Asisten AI sederhana, cepat,
            dan ditenagai Gemini.
        </p>

    </section>

</div>

</main><div class="composer-wrap"><div class="composer">

    <textarea
        id="prompt"
        rows="1"
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
        placeholder="Tanya Asep AI..."
    ></textarea>

    <button
        class="send"
        id="sendBtn"
        onclick="sendMessage()">
        ↑
    </button>

</div>

</div></div><!-- =========================
     SETTINGS
========================= --><div class="modal" id="modal"><div class="modal-card">

    <div class="modal-title">

        <h2>Gemini API Key</h2>

        <button
            class="close"
            onclick="closeSettings()">
            ×
        </button>

    </div>

    <p class="modal-description">
        Masukkan API key Gemini kamu.
        Input dibuat sebagai teks biasa agar
        fitur paste Android tetap nyaman digunakan.
    </p>

    <div class="key-row">

        <input
            id="apiKey"
            class="key-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Paste API key di sini"
        >

        <button
            class="paste-button"
            onclick="pasteKey()">
            Paste
        </button>

    </div>

    <button
        class="save-button"
        onclick="saveKey()">
        Simpan API Key
    </button>

</div>

</div><script>

const MODEL = "gemini-3.7-flash";

let apiKey =
    localStorage.getItem("ASEP_GEMINI_KEY") || "";

const promptBox =
    document.getElementById("prompt");

const messages =
    document.getElementById("messages");

const sendBtn =
    document.getElementById("sendBtn");

const welcome =
    document.getElementById("welcome");

const modal =
    document.getElementById("modal");

const keyInput =
    document.getElementById("apiKey");


/* =========================
   TEXTAREA
========================= */

promptBox.addEventListener("input",()=>{

    promptBox.style.height = "auto";

    promptBox.style.height =
        Math.min(promptBox.scrollHeight,140)
        + "px";

});


promptBox.addEventListener("keydown",(e)=>{

    if(
        e.key === "Enter" &&
        !e.shiftKey
    ){
        e.preventDefault();
        sendMessage();
    }

});


/* =========================
   SETTINGS
========================= */

function openSettings(){

    modal.classList.add("show");

    keyInput.value = apiKey;

    setTimeout(()=>{
        keyInput.focus();
    },150);

}


function closeSettings(){

    modal.classList.remove("show");

}


/* =========================
   ANDROID FRIENDLY PASTE
========================= */

async function pasteKey(){

    try{

        /*
          Modern browsers.
        */

        if(
            navigator.clipboard &&
            navigator.clipboard.readText
        ){

            const text =
                await navigator.clipboard.readText();

            if(text){

                keyInput.value = text;

                keyInput.focus();

                return;
            }
        }

        /*
          If clipboard API is unavailable,
          focus the input so Android's native
          long-press Paste menu remains available.
        */

        keyInput.focus();

        alert(
            "Clipboard otomatis tidak tersedia di browser ini. " +
            "Tekan lama kolom API Key lalu pilih Paste."
        );

    }catch(error){

        keyInput.focus();

        alert(
            "Tekan lama kolom API Key lalu pilih Paste."
        );

    }

}


/* =========================
   SAVE KEY
========================= */

function saveKey(){

    const value =
        keyInput.value.trim();

    if(!value){

        alert("API Key masih kosong.");

        keyInput.focus();

        return;
    }

    apiKey = value;

    localStorage.setItem(
        "ASEP_GEMINI_KEY",
        apiKey
    );

    closeSettings();

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(type,text){

    welcome.style.display = "none";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + type;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        type === "ai" ? "A" : "U";

    const body =
        document.createElement("div");

    body.className =
        "message-body";

    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        type === "ai"
            ? "Asep AI"
            : "Kamu";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent = text;

    body.appendChild(name);
    body.appendChild(content);

    wrapper.appendChild(avatar);
    wrapper.appendChild(body);

    messages.appendChild(wrapper);

    scrollBottom();

    return content;

}


/* =========================
   TYPING
========================= */

function showTyping(){

    welcome.style.display = "none";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message ai";

    wrapper.id = "typing";

    wrapper.innerHTML = `

        <div class="avatar">A</div>

        <div class="message-body">

            <div class="message-name">
                Asep AI
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>
    `;

    messages.appendChild(wrapper);

    scrollBottom();

}


function removeTyping(){

    document
        .getElementById("typing")
        ?.remove();

}


function scrollBottom(){

    const chat =
        document.getElementById("chat");

    requestAnimationFrame(()=>{

        chat.scrollTo({
            top:chat.scrollHeight,
            behavior:"smooth"
        });

    });

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const text =
        promptBox.value.trim();

    if(!text)
        return;

    if(!apiKey){

        openSettings();

        return;

    }

    addMessage("user",text);

    promptBox.value = "";
    promptBox.style.height = "44px";

    sendBtn.disabled = true;

    showTyping();

    try{

        const response =
            await fetch(
                "https://generativelanguage.googleapis.com/v1beta/interactions",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "x-goog-api-key":
                            apiKey
                    },

                    body:JSON.stringify({

                        model:MODEL,

                        input:text

                    })
                }
            );


        const data =
            await response.json();


        removeTyping();


        if(!response.ok){

            throw new Error(
                data?.error?.message ||
                "Gemini API error."
            );

        }


        let answer =
            data.output_text;


        /*
          Compatibility fallback.
        */

        if(
            !answer &&
            Array.isArray(data.steps)
        ){

            for(
                const step
                of data.steps
            ){

                if(
                    step.type ===
                    "model_output"
                ){

                    if(
                        Array.isArray(
                            step.content
                        )
                    ){

                        for(
                            const block
                            of step.content
                        ){

                            if(
                                block.type ===
                                "text"
                            ){

                                answer =
                                    block.text;

                            }

                        }

                    }

                }

            }

        }


        if(!answer){

            answer =
                "Asep AI tidak menerima respons teks.";

        }


        addMessage(
            "ai",
            answer
        );


    }catch(error){

        removeTyping();

        addMessage(
            "ai",
            "Terjadi error:\n" +
            error.message
        );

    }finally{

        sendBtn.disabled = false;

        promptBox.focus();

    }

}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

modal.addEventListener("click",(e)=>{

    if(e.target === modal){

        closeSettings();

    }

});

</script></body>
</html>
