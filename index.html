<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asep AI</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07070a;
    --panel:rgba(20,20,26,.72);
    --panel2:rgba(30,30,38,.72);
    --border:rgba(255,255,255,.09);
    --text:#f7f7fa;
    --muted:#92929d;
    --accent:#8b5cf6;
    --accent2:#6366f1;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 10%,rgba(139,92,246,.16),transparent 30%),
        radial-gradient(circle at 85% 85%,rgba(99,102,241,.12),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
}

/* Background */
.bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.orb{
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.16;
    animation:float 9s ease-in-out infinite alternate;
}

.orb.one{
    background:#8b5cf6;
    left:-100px;
    top:10%;
}

.orb.two{
    background:#2563eb;
    right:-100px;
    bottom:0;
    animation-delay:2s;
}

@keyframes float{
    from{transform:translateY(-20px) scale(1)}
    to{transform:translateY(30px) scale(1.15)}
}

/* App */
.app{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* Header */
header{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid var(--border);
    background:rgba(7,7,10,.65);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    z-index:5;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    font-size:20px;
    letter-spacing:-.5px;
}

.logo-icon{
    width:40px;
    height:40px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    box-shadow:
        0 0 30px rgba(139,92,246,.35),
        inset 0 1px rgba(255,255,255,.3);
    font-size:20px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    color:var(--muted);
    font-size:12px;
    background:rgba(255,255,255,.035);
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 12px #4ade80;
}

/* Chat */
.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 18px 150px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#292932;
    border-radius:10px;
}

.messages{
    width:min(900px,100%);
    margin:auto;
}

/* Welcome */
.welcome{
    min-height:55vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    animation:appear .7s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.welcome-logo{
    width:80px;
    height:80px;
    border-radius:25px;
    display:grid;
    place-items:center;
    font-size:36px;
    margin-bottom:22px;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    box-shadow:0 20px 60px rgba(99,102,241,.28);
}

.welcome h1{
    font-size:clamp(35px,7vw,58px);
    letter-spacing:-2.5px;
    background:linear-gradient(90deg,#fff,#bdb4ff);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    margin-top:12px;
    color:var(--muted);
    font-size:15px;
}

/* Messages */
.message{
    display:flex;
    gap:13px;
    margin:22px 0;
    animation:messageIn .35s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:14px;
    font-weight:700;
}

.ai .avatar{
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
}

.user .avatar{
    background:#25252d;
}

.content{
    flex:1;
    line-height:1.7;
    font-size:15px;
    white-space:pre-wrap;
    word-break:break-word;
}

.name{
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
}

/* Input */
.input-area{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:16px;
    background:linear-gradient(
        transparent,
        rgba(7,7,10,.9) 25%
    );
    z-index:10;
}

.composer{
    width:min(900px,100%);
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:9px;
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(25,25,31,.85);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 15px 50px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.04);
    transition:.25s;
}

.composer:focus-within{
    border-color:rgba(139,92,246,.45);
    box-shadow:
        0 15px 60px rgba(0,0,0,.4),
        0 0 0 3px rgba(139,92,246,.08);
}

textarea{
    flex:1;
    resize:none;
    max-height:150px;
    min-height:45px;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font:inherit;
    padding:12px 10px;
}

textarea::placeholder{
    color:#70707a;
}

button{
    border:none;
    cursor:pointer;
    color:white;
}

.send{
    width:45px;
    height:45px;
    border-radius:15px;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    font-size:18px;
    transition:.2s;
}

.send:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 10px 30px rgba(99,102,241,.35);
}

.send:active{
    transform:scale(.94);
}

.send:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

/* API modal */
.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);
    z-index:50;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(480px,100%);
    padding:25px;
    border-radius:24px;
    background:#15151b;
    border:1px solid var(--border);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.modal-card h2{
    margin-bottom:8px;
}

.modal-card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    margin-bottom:18px;
}

.api-input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#0c0c10;
    color:white;
    outline:none;
    margin-bottom:12px;
}

.save{
    width:100%;
    padding:13px;
    border-radius:14px;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    font-weight:700;
}

.settings{
    padding:9px 12px;
    border-radius:12px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    font-size:13px;
}

.typing{
    display:flex;
    gap:5px;
    padding-top:8px;
}

.typing span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#aaa;
    animation:bounce 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes bounce{
    0%,70%,100%{transform:translateY(0);opacity:.4}
    35%{transform:translateY(-5px);opacity:1}
}

@media(max-width:600px){
    header{
        padding:0 14px;
    }

    .status{
        display:none;
    }

    .chat{
        padding-top:20px;
    }

    .welcome{
        min-height:60vh;
    }

    .welcome h1{
        letter-spacing:-1.8px;
    }
}
</style></head><body><div class="bg">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div><div class="app"><header>
    <div class="logo">
        <div class="logo-icon">✦</div>
        Asep AI
    </div><div style="display:flex;gap:8px;align-items:center">
    <div class="status">
        <span class="dot"></span>
        Gemini Online
    </div>

    <button class="settings" onclick="openSettings()">⚙</button>
</div>

</header><main class="chat" id="chat">
    <div class="messages" id="messages">    <section class="welcome" id="welcome">
        <div class="welcome-logo">✦</div>
        <h1>Asep AI</h1>
        <p>Asisten AI modern yang ditenagai Gemini.</p>
    </section>

</div>

</main><div class="input-area">
    <div class="composer">
        <textarea
            id="prompt"
            rows="1"
            placeholder="Tanyakan sesuatu kepada Asep AI..."
        ></textarea>    <button class="send" id="sendBtn" onclick="sendMessage()">
        ➤
    </button>
</div>

</div></div><!-- API SETTINGS --><div class="modal" id="modal">
    <div class="modal-card">
        <h2>Gemini API Key</h2>    <p>
        Masukkan API key secara lokal. Jangan upload file ini
        ke hosting publik jika key ditulis langsung di source code.
    </p>

    <input
        class="api-input"
        id="apiKey"
        type="password"
        placeholder="Masukkan Gemini API Key..."
    >

    <button class="save" onclick="saveKey()">
        Simpan API Key
    </button>
</div>

</div><script>
/*
    ASEP AI
    Gemini Interactions API
*/

const MODEL = "gemini-3.7-flash";

let apiKey = localStorage.getItem("ASEP_GEMINI_KEY") || "";

const promptBox = document.getElementById("prompt");
const messages = document.getElementById("messages");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");

promptBox.addEventListener("input", () => {
    promptBox.style.height = "auto";
    promptBox.style.height =
        Math.min(promptBox.scrollHeight,150) + "px";
});

promptBox.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
    }
});

function openSettings(){
    document.getElementById("modal").classList.add("show");
    document.getElementById("apiKey").value = apiKey;
}

function saveKey(){
    const value = document.getElementById("apiKey").value.trim();

    if(!value){
        alert("Masukkan API key terlebih dahulu.");
        return;
    }

    apiKey = value;
    localStorage.setItem("ASEP_GEMINI_KEY", apiKey);

    document.getElementById("modal").classList.remove("show");
}

function addMessage(type,text){
    if(welcome){
        welcome.style.display = "none";
    }

    const wrapper = document.createElement("div");
    wrapper.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "ai" ? "✦" : "U";

    const body = document.createElement("div");

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = type === "ai" ? "Asep AI" : "Kamu";

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;

    body.appendChild(name);
    body.appendChild(content);

    wrapper.appendChild(avatar);
    wrapper.appendChild(body);

    messages.appendChild(wrapper);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;

    return content;
}

function addTyping(){
    if(welcome){
        welcome.style.display = "none";
    }

    const wrapper = document.createElement("div");
    wrapper.className = "message ai";
    wrapper.id = "typing";

    wrapper.innerHTML = `
        <div class="avatar">✦</div>
        <div>
            <div class="name">Asep AI</div>
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    messages.appendChild(wrapper);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}

function removeTyping(){
    document.getElementById("typing")?.remove();
}

async function sendMessage(){

    const text = promptBox.value.trim();

    if(!text) return;

    if(!apiKey){
        openSettings();
        return;
    }

    addMessage("user",text);

    promptBox.value = "";
    promptBox.style.height = "45px";

    sendBtn.disabled = true;
    addTyping();

    try{

        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/interactions",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "x-goog-api-key":apiKey
                },

                body:JSON.stringify({
                    model:MODEL,
                    input:text
                })
            }
        );

        const data = await response.json();

        removeTyping();

        if(!response.ok){
            throw new Error(
                data?.error?.message ||
                "Gemini API mengalami error."
            );
        }

        let answer = data.output_text;

        /*
          Fallback parser jika struktur response berubah.
        */
        if(!answer && Array.isArray(data.steps)){
            for(const step of data.steps){
                if(step.type === "model_output"){
                    if(Array.isArray(step.content)){
                        for(const block of step.content){
                            if(block.type === "text"){
                                answer = block.text;
                            }
                        }
                    }
                }
            }
        }

        if(!answer){
            answer = "Maaf, Asep AI tidak mendapatkan respons teks.";
        }

        addMessage("ai",answer);

    }catch(error){

        removeTyping();

        addMessage(
            "ai",
            "⚠️ Terjadi error:\n" + error.message
        );

    }finally{

        sendBtn.disabled = false;
        promptBox.focus();

    }
}
</script></body>
</html>
