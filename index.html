<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoLocate — Akurat GPS & Maps</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --border-hover: #52525b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-white: #ffffff;
      --accent-black: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52525b;
    }

    .status-dot.active {
      background: var(--accent-white);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .data-box {
      background: #000000;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 10px;
    }

    .data-box label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .data-box span {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .full-width {
      grid-column: span 2;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent-white);
      color: var(--accent-black);
    }

    .btn-primary:hover {
      background: #e4e4e7;
    }

    .btn-secondary {
      background: #18181b;
      color: var(--text-main);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--border-hover);
      background: #27272a;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .map-container {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: grayscale(100%) invert(92%) contrast(83%);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-white);
      color: var(--accent-black);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Deteksi Lokasi Presisi</h1>
      <p>Dapatkan koordinat GPS real-time & integrasi Google Maps</p>
    </div>

    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Menunggu perintah...</span>
    </div>

    <div class="data-grid">
      <div class="data-box">
        <label>Latitude</label>
        <span id="lat">0.000000</span>
      </div>
      <div class="data-box">
        <label>Longitude</label>
        <span id="lng">0.000000</span>
      </div>
      <div class="data-box full-width">
        <label>Akurasi GPS</label>
        <span id="accuracy">-</span>
      </div>
    </div>

    <div class="button-group">
      <button class="btn btn-primary" onclick="getLocation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        Cari Lokasi
      </button>
      <button class="btn btn-secondary" id="btnCopy" onclick="copyCoordinates()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Salin
      </button>
      <a id="btnMaps" class="btn btn-secondary" style="display: none; text-decoration: none;" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Buka Maps
      </a>
    </div>

    <div class="map-container" id="mapBox">
      <span>Peta akan muncul setelah lokasi terdeteksi.</span>
    </div>
  </div>

  <div class="toast" id="toast">Koordinat berhasil disalin!</div>

  <script>
    let currentCoords = "";

    function getLocation() {
      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");
      const btnCopy = document.getElementById("btnCopy");
      const mapBox = document.getElementById("mapBox");

      if (!navigator.geolocation) {
        statusText.innerText = "Geolocation tidak didukung oleh browser Anda.";
        return;
      }

      statusText.innerText = "Mengakses sensor GPS...";
      statusDot.classList.remove("active");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const acc = position.coords.accuracy;

          currentCoords = `${latitude}, ${longitude}`;

          document.getElementById("lat").innerText = latitude.toFixed(6);
          document.getElementById("lng").innerText = longitude.toFixed(6);
          document.getElementById("accuracy").innerText = `± ${acc.toFixed(1)} meter`;

          statusText.innerText = "Lokasi akurat ditemukan";
          statusDot.classList.add("active");
          btnCopy.disabled = false;

          // Render Google Maps iframe
          mapBox.innerHTML = `
            <iframe 
              src="https://maps.google.com/maps?q=${latitude},${longitude}&z=16&output=embed"
              allowfullscreen="" 
              loading="lazy">
            </iframe>
          `;

          // Update tautan Google Maps luar
          const btnMaps = document.getElementById("btnMaps");
          btnMaps.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
          btnMaps.style.display = "inline-flex";
        },
        (error) => {
          let msg = "Gagal mengambil lokasi.";
          if (error.code === error.PERMISSION_DENIED) {
            msg = "Izin lokasi ditolak oleh pengguna.";
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            msg = "Sinyal lokasi tidak tersedia.";
          } else if (error.code === error.TIMEOUT) {
            msg = "Waktu permintaan lokasi habis.";
          }
          statusText.innerText = msg;
          statusDot.classList.remove("active");
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function copyCoordinates() {
      if (!currentCoords) return;

      navigator.clipboard.writeText(currentCoords).then(() => {
        showToast();
      }).catch(() => {
        prompt("Silakan salin koordinat secara manual:", currentCoords);
      });
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }
  </script>
</body>
</html>
